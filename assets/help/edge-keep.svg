<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif">
  <!-- Edge's Downloads panel when it holds back Halt-Setup.exe: the three dots (1), then Keep (2) -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".18"/></filter>
  </defs>
  <rect width="520" height="310" rx="18" fill="#eef0f6"/>
  <rect x="16" y="16" width="488" height="160" rx="10" fill="#fff" stroke="#dcdfe6" filter="url(#sh)"/>
  <text x="34" y="48" font-size="15" font-weight="600" fill="#1b1b1f">Downloads</text>
  <g fill="none" stroke="#5d5f66" stroke-width="1.6" stroke-linecap="round">
    <path d="M404 37h10l3 3h9v10h-22z"/><circle cx="447" cy="43" r="5.5"/><path d="M451 47l4 4"/><path d="M472 43h.1M478 43h.1M484 43h.1" stroke-width="2.6"/>
  </g>
  <line x1="16" y1="64" x2="504" y2="64" stroke="#ececf1"/>
  <!-- the file, held back -->
  <rect x="34" y="84" width="34" height="38" rx="5" fill="#f3f4f8" stroke="#c9ccd6"/>
  <path d="M42 96h18v14H42z M42 100h18" fill="none" stroke="#7a7f8c" stroke-width="1.4"/>
  <path d="M60 106l9 16H51z" fill="#f4b400" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M60 112v4" stroke="#1b1b1f" stroke-width="1.6"/><circle cx="60" cy="119" r=".9" fill="#1b1b1f"/>
  <text x="84" y="96" font-size="13.5" fill="#1b1b1f">Halt-Setup.exe isn't commonly downloaded.</text>
  <text x="84" y="116" font-size="12.5" fill="#5d5f66">Make sure you trust Halt-Setup.exe before you</text>
  <text x="84" y="134" font-size="12.5" fill="#5d5f66">open it.</text>
  <!-- 1: the three dots -->
  <rect x="452" y="88" width="34" height="30" rx="6" fill="#f0e8ff"/>
  <path d="M461 103h.1M469 103h.1M477 103h.1" stroke="#1b1b1f" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="449" y="85" width="40" height="36" rx="8" fill="none" stroke="#7f00ff" stroke-width="2.5"/>
  <g transform="translate(497 78)"><circle r="11" fill="#7f00ff"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text></g>
  <!-- the menu it opens -->
  <rect x="282" y="132" width="214" height="160" rx="8" fill="#fff" stroke="#dcdfe6" filter="url(#sh)"/>
  <g font-size="13" fill="#1b1b1f">
    <text x="300" y="160">Delete</text>
    <rect x="288" y="172" width="202" height="30" rx="5" fill="#f0e8ff"/>
    <text x="300" y="192" font-weight="600">Keep</text>
    <text x="300" y="224">Report this file as safe</text>
    <text x="300" y="254">Learn more</text>
    <text x="300" y="282">Copy download link</text>
  </g>
  <rect x="286" y="170" width="206" height="34" rx="7" fill="none" stroke="#7f00ff" stroke-width="2.5"/>
  <g transform="translate(270 187)"><circle r="11" fill="#7f00ff"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text></g>
</svg>
