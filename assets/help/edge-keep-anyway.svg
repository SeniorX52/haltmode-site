<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif">
  <!-- the box Edge shows after Keep: Show more (3), then Keep anyway (4) -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".18"/></filter>
  </defs>
  <rect width="520" height="310" rx="18" fill="#eef0f6"/>
  <rect x="16" y="16" width="488" height="278" rx="10" fill="#fff" stroke="#dcdfe6" filter="url(#sh)"/>
  <text x="36" y="52" font-size="16" font-weight="600" fill="#1b1b1f">Make sure you trust Halt-Setup.exe before you</text>
  <text x="36" y="74" font-size="16" font-weight="600" fill="#1b1b1f">open it</text>
  <g font-size="12.5" fill="#5d5f66">
    <text x="36" y="104">Microsoft Defender SmartScreen couldn't verify if this file is safe</text>
    <text x="36" y="122">because it isn't commonly downloaded. Make sure you trust the file</text>
    <text x="36" y="140">you're downloading or its source before you open it.</text>
  </g>
  <!-- 3: Show more -->
  <text x="36" y="174" font-size="13" fill="#0f6cbd">Show more</text>
  <path d="M106 168l4 4 4-4" fill="none" stroke="#0f6cbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="158" width="92" height="24" rx="6" fill="none" stroke="#7f00ff" stroke-width="2.5"/>
  <g transform="translate(138 170)"><circle r="11" fill="#7f00ff"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text></g>
  <!-- what it shows: 4: Keep anyway -->
  <rect x="34" y="192" width="120" height="28" rx="5" fill="#f0e8ff"/>
  <text x="46" y="211" font-size="13" font-weight="600" fill="#0f6cbd">Keep anyway</text>
  <rect x="31" y="189" width="126" height="34" rx="7" fill="none" stroke="#7f00ff" stroke-width="2.5"/>
  <g transform="translate(173 206)"><circle r="11" fill="#7f00ff"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text></g>
  <text x="46" y="244" font-size="13" fill="#0f6cbd">Report this app as safe</text>
  <!-- the box's own buttons -->
  <rect x="304" y="252" width="90" height="30" rx="5" fill="#0f6cbd"/><text x="349" y="272" text-anchor="middle" font-size="13" fill="#fff">Delete</text>
  <rect x="402" y="252" width="88" height="30" rx="5" fill="#fff" stroke="#c9ccd6"/><text x="446" y="272" text-anchor="middle" font-size="13" fill="#1b1b1f">Cancel</text>
</svg>
