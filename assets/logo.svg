<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Halt's icon, in the website's colors: a near-black glass tile, and a simple hourglass in the
       indigo, violet and lilac of haltmode.com (c1 #5b6cff, c3 #7f00ff, c4 #b06bff) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132e"/><stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".86" r=".62">
      <stop offset="0" stop-color="#7f00ff" stop-opacity=".55"/><stop offset="1" stop-color="#7f00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/><stop offset=".5" stop-color="#8a1dff"/><stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b8ff"/><stop offset="1" stop-color="#9a45ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#glow)"/>
  <rect x="68" y="68" width="888" height="888" rx="212" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="8"/>

  <g filter="url(#shadow)">
    <!-- glass -->
    <path d="M318 268 C318 410 470 470 494 512 C470 554 318 614 318 756 L706 756 C706 614 554 554 530 512 C554 470 706 410 706 268 Z"
          fill="url(#brand)" fill-opacity=".16" stroke="url(#brand)" stroke-width="24" stroke-linejoin="round"/>
    <!-- sand: what's left on top, the pile below, the grains between -->
    <path d="M378 360 C450 376 574 376 646 360 C628 424 556 466 512 494 C468 466 396 424 378 360 Z" fill="url(#sand)"/>
    <path d="M346 742 C390 676 462 634 512 624 C562 634 634 676 678 742 Z" fill="url(#sand)"/>
    <circle cx="512" cy="548" r="14" fill="#e9d9ff"/><circle cx="512" cy="590" r="12" fill="#e9d9ff"/>
    <!-- caps, lit from above -->
    <rect x="262" y="214" width="500" height="74" rx="37" fill="url(#brand)"/>
    <rect x="262" y="214" width="500" height="74" rx="37" fill="url(#cap)"/>
    <rect x="262" y="736" width="500" height="74" rx="37" fill="url(#brand)"/>
    <rect x="262" y="736" width="500" height="74" rx="37" fill="url(#cap)"/>
  </g>
</svg>
